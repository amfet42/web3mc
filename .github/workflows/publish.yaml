name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example, v0.1.15)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: refs/tags/${{ inputs.release_tag || github.event.release.tag_name }}

    - name: Setup Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: python -m pip install poetry==1.5.1

    - name: Verify release version
      run: |
        package_version=$(poetry version --short)
        if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
          echo "::error::Release tag must match the package version: v$package_version"
          exit 1
        fi

    - name: Build package
      run: poetry build

    - name: Publish to PyPI
      env:
        POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
      run: poetry publish
